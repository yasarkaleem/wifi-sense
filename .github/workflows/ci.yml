name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: python-tests (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: services/ingest
            extras: dev
          - path: services/replay
            extras: dev
          - path: services/pipeline
            # ml (PyTorch) + localize (scikit-learn) so the full test suite
            # runs, including the integration tests that spawn real
            # replay/ingest/pipeline subprocesses — see
            # services/pipeline/README.md.
            extras: dev,ml,localize
          - path: datasets
            extras: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: pytest -v

  node-build:
    name: node-build (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [services/api, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Run tests
        if: matrix.path == 'services/api'
        working-directory: services/api
        run: npm test

      - name: Build
        if: matrix.path == 'dashboard'
        working-directory: dashboard
        run: npm run build

  docker-builds:
    name: docker-build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - {name: ingest, context: services/ingest}
          - {name: pipeline, context: services/pipeline}
          - {name: replay, context: services/replay}
          - {name: api, context: services/api}
          - {name: dashboard, context: dashboard}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: wifi-sense/${{ matrix.service.name }}:ci
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  compose-config:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
