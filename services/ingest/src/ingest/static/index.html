<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>wifi-sense ingest — CSI amplitude waterfall</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    height: 100%;
  }
  #status {
    padding: 8px 12px;
    font-size: 14px;
    box-sizing: border-box;
  }
  #plot {
    display: block;
    width: 100%;
    height: calc(100vh - 40px);
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <canvas id="plot"></canvas>
  <script>
    const canvas = document.getElementById("plot");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    function resize() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Dark-blue -> teal -> yellow ramp (viridis-ish), no external assets.
    function amplitudeToColor(value, min, max) {
      const t = max > min ? (value - min) / (max - min) : 0;
      const r = Math.round(68 + t * (253 - 68));
      const g = Math.round(1 + t * (231 - 1));
      const b = Math.round(84 + t * (37 - 84));
      return `rgb(${r},${g},${b})`;
    }

    function draw(data) {
      const matrix = data.amplitude_matrix;
      if (!matrix.length) return;

      let min = Infinity;
      let max = -Infinity;
      for (const row of matrix) {
        for (const v of row) {
          if (v < min) min = v;
          if (v > max) max = v;
        }
      }

      const rows = matrix.length;
      const cols = matrix[0].length;
      const cellW = canvas.width / cols;
      const cellH = canvas.height / rows;

      for (let r = 0; r < rows; r++) {
        // Most recent frame drawn at the bottom, scrolling up as it ages.
        const y = canvas.height - (r + 1) * cellH;
        const row = matrix[r];
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = amplitudeToColor(row[c], min, max);
          ctx.fillRect(c * cellW, y, cellW + 1, cellH + 1);
        }
      }
    }

    async function poll() {
      try {
        const res = await fetch("/data.json", { cache: "no-store" });
        const data = await res.json();
        draw(data);
        const latestSeq = data.sequence_numbers.length
          ? data.sequence_numbers[data.sequence_numbers.length - 1]
          : "—";
        status.textContent =
          `frames: ${data.frame_count}/${data.capacity}  ` +
          `subcarriers: ${data.subcarrier_count}  latest seq: ${latestSeq}`;
      } catch (err) {
        status.textContent = "disconnected: " + err;
      } finally {
        setTimeout(poll, 100);
      }
    }

    poll();
  </script>
</body>
</html>
