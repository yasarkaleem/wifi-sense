[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest"
version = "0.1.0"
description = "Receives CSI frames over UDP, validates and buffers them, and publishes them over ZeroMQ (with an optional debug live waterfall plot)."
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ingest = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
