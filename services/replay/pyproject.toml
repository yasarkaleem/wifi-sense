[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replay"
version = "0.1.0"
description = "Streams synthetic (or recorded) CSI data over UDP to emulate a live ESP32."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replay = ["scenarios.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
